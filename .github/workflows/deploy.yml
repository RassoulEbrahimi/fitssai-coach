name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Every pull request aimed at main runs the same three gates the branch
  # itself runs, so a change is proven green before it is merged rather than
  # after. Ordinary pull_request and not pull_request_target: a fork's code
  # must never run with this repository's token or secrets.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Pages accepts one deployment at a time, so everything that can deploy
  # stays in the single shared group and queues. Pull request validation never
  # deploys and must not be able to hold a deployment behind it, so each pull
  # request gets its own group, where a new push supersedes the run it
  # replaces. Both expressions are constant for push and workflow_dispatch:
  # group 'pages', no cancellation, exactly as before.
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The server-side execution layer has its own dependency tree, its own
  # compiler settings and its own test runner, so it gets its own job. The
  # Pages deployment waits for it: a broken backend must not ride out with a
  # green-looking site.
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install functions dependencies
        run: npm --prefix functions ci

      - name: Functions typecheck
        run: npm --prefix functions run typecheck

      - name: Functions tests
        run: npm --prefix functions run test

      - name: Functions build
        run: npm --prefix functions run build

  # Firestore Security Rules, exercised against the real rules engine in the
  # emulator. This is the only job that can prove an access-control claim, so
  # it gets its own runner: it needs Java and a downloaded emulator, which the
  # other jobs have no use for. The Pages deployment waits for it.
  rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rules-tests/package-lock.json

      # The Firestore emulator is a JAR.
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install rules-test dependencies
        run: npm --prefix rules-tests ci

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Firestore rules tests
        run: npm run test:rules

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Client half only; the functions half runs in the backend job above so
      # the two compilers are never run twice for the same commit.
      - name: Typecheck
        run: npm run typecheck:client

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          GITHUB_SHA: ${{ github.sha }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}

      - name: Mojibake guard
        run: npm run check:mojibake

      - name: Placeholder guard
        run: npm run check:placeholders

      - name: Create GitHub Pages SPA fallback
        run: cp dist/index.html dist/404.html

      # v5 and not v4: v4 still pins actions/upload-artifact 4.6.2 internally,
      # which runs on the deprecated Node 20 action runtime.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    # The github-pages environment is already restricted to main, but that
    # rejection only happens once the job has been entered. This states the
    # same rule up front: publish what main actually holds, from a push to it
    # or a manual redeploy of it. A pull request run matches neither -- its ref
    # is refs/pull/<n>/merge -- so the job is skipped rather than failed, and
    # no pull request ever reaches the deployment environment.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [build, backend, rules]
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
