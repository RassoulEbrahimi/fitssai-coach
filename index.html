<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Theme: applied before first paint so there is no light/dark flash.
         Canonical key is fitssai.theme; the legacy generic "theme" key is
         migrated once. Kept deliberately minimal — no other boot logic. -->
    <script>
      (function () {
        try {
          var KEY = "fitssai.theme";
          var LEGACY = "theme";
          var valid = { light: 1, dark: 1, system: 1 };
          var stored = localStorage.getItem(KEY);
          if (!valid[stored]) {
            var legacy = localStorage.getItem(LEGACY);
            if (valid[legacy]) {
              localStorage.setItem(KEY, legacy);
              localStorage.removeItem(LEGACY);
              stored = legacy;
            } else {
              stored = "system";
            }
          }
          var resolved =
            stored === "system"
              ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
              : stored;
          var root = document.documentElement;
          root.classList.remove("light", "dark");
          root.classList.add(resolved);
          root.style.colorScheme = resolved;
        } catch (e) {
          /* Blocked storage: leave the default stylesheet in charge. */
        }
      })();
    </script>
    <title>FitssAI — Dein KI-Coach für Training & Ernährung</title>
    <meta name="description" content="Dein KI-Coach für Training & Ernährung." />

    <!-- The manifest link is injected at build time by vite-plugin-pwa, which
         is the single source for both the manifest and the service worker.
         Do not add a second manifest link here. -->
    <meta name="theme-color" content="#16a34a" />
    
    <!-- PWA Icons -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png?v=3">
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/fitssai-192.png?v=3">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="FitssAI">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    
    <!-- Font support -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Vazirmatn:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <meta property="og:title" content="FitssAI" />
    <meta property="og:description" content="Dein KI-Coach für Training & Ernährung." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="de_DE" />

    <meta name="twitter:card" content="summary" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
